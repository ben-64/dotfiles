# =====================================================================
# Config Kitty — traduite depuis wezterm.lua
# À copier dans :  ~/.config/kitty/kitty.conf
# Recharge à chaud : Cmd + Ctrl + ,
# Syntaxe : "clé valeur" (PAS de signe =)
# =====================================================================

# --- Fenêtre : géométrie initiale (suffixe c = cellules) ---
remember_window_size   no
initial_window_width   120c
initial_window_height  28c

# --- Police ---
font_family   JetBrainsMono Nerd Font Mono
bold_font          auto
font_size     14.0
# wezterm mettait la graisse Bold par défaut. Pour l'imiter, décommente :
# font_family   family="MesloLGS Nerd Font Propo" style=Bold

# --- Thème ---
# Tu as déjà les schémas iTerm2 en local : on inclut directement Guezwhoz.
#include ~/Documents/tools/iTerm2-Color-Schemes/kitty/Guezwhoz.conf
# Alternative : la galerie intégrée de Kitty  ->  kitten themes

# --- Apparence fenêtre ---
background_opacity        1.0
background_blur           0
# Équivalent le plus proche de window_decorations = "RESIZE" :
#hide_window_decorations   titlebar-only
hide_window_decorations no
macos_titlebar_color background

# --- Bordures de panneaux (≈ tes active_border / inactive_border) ---
active_border_color    #45475a
inactive_border_color  #313244
window_border_width    1px
draw_minimal_borders   yes

# --- Panneaux inactifs estompés (≈ inactive_pane_hsb) ---
inactive_text_alpha    0.5

# --- Comportement macOS ---
macos_option_as_alt    left

# --- Layouts (nécessaire pour les splits) ---
enabled_layouts        splits,stack,tall,grid

# Tabs
# --- Position & style ---
tab_bar_edge            bottom
tab_bar_style           powerline

# angled | slanted | round
tab_powerline_style     slanted          
tab_bar_align           left
tab_bar_min_tabs        2

# --- Comportement ---
tab_switch_strategy     previous
tab_activity_symbol     "•"
bell_on_tab             "🔔 "

# --- Contenu de l'onglet ---
tab_title_template          "{index}: {title}"
active_tab_title_template    "{index}: {title} [{num_windows}] {layout_name}"

# --- Couleurs ---
active_tab_foreground     #11111b
active_tab_background     #a6e3a1
active_tab_font_style     bold
inactive_tab_foreground   #cdd6f4
inactive_tab_background   #313244
inactive_tab_font_style   normal
tab_bar_background        #181825

# Fancy
#cursor_trail 1
#cursor_trail_decay 0.2 0.3

# =====================================================================
# Raccourcis (map touche action)
# =====================================================================

#
# zellij
#
# Entrée dans les sous-modes (leader + lettre de catégorie)
map cmd+t send_text all \x02t
map cmd+p send_text all \x02p
map cmd+r send_text all \x02r
map cmd+m send_text all \x02m
map cmd+s send_text all \x02s
#
# Focus Pance
map cmd+left  kitten pass_or_nav.py left neighboring_window left
map cmd+right kitten pass_or_nav.py right neighboring_window right
map cmd+up    kitten pass_or_nav.py up neighboring_window up
map cmd+down  kitten pass_or_nav.py down neighboring_window down

# Splits
map cmd+shift+v  launch --location=vsplit --cwd=current
map cmd+shift+h  launch --location=hsplit --cwd=current

# Naviguer entre les splits
map cmd+h     neighboring_window left
map cmd+j     neighboring_window down
map cmd+k     neighboring_window up
map cmd+l     neighboring_window right

# Naviguer entre les onglets
map cmd+alt+left          kitten pass_or_nav.py prev_tab previous_tab
map cmd+alt+right         kitten pass_or_nav.py next_tab next_tab
map cmd+alt+shift+right   next_tab
map cmd+alt+shift+left    prev_tab
map cmd+alt+shift+t       new_tab

# Saut de mot avec Alt+flèches (ESC+b / ESC+f)
map alt+left   send_text all \x1bb
map alt+right  send_text all \x1bf

# Hints
map alt+w kitten hints --type word --program @


# --- Détach tmux (obsolète avec Zellij, laissé en mémoire) ---
# map ctrl+shift+d  send_text all tmux detach-client\r


# BEGIN_KITTY_THEME
# Arthur
include current-theme.conf
# END_KITTY_THEME
